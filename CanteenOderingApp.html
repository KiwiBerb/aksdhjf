<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canteen Ordering App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .start-screen h1 {
            color: white;
            font-size: 50px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            z-index: 1;
            border: 3px solid white;
            padding: 20px 40px;
            border-radius: 10px;
        }
        .start-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                        url('https://www.aics.nsw.edu.au/wp-content/uploads/2015/11/Canteen-1024x683.jpg') center/cover;
            text-align: center;
        }

        .start-button {
            padding: 20px 40px;
            font-size: 35px;
            background-color: #ac2525;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 90%;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
        }

        .start-button:hover {
            background-color: #871010;
        }

        .menu-screen {
            display: none;
            padding: 20px;
            padding-bottom: 0px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .menu-screen.active {
            display: block;
            padding-bottom: 120px;
        }

        .back-button {
            margin-bottom: 20px;
            padding: 10px 20px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .category-btn {
        position: relative;
        height: 160px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        background-size: cover;
        background-position: center;
        overflow: hidden;
        transition: transform 0.3s;
        }
        
        .category-btn:hover {
        transform: scale(1.03);
        }
        
        .category-btn::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.45);
        }

        .category-btn span {
        position: relative;
        z-index: 1;
        color: white;
        font-size: 24px;
        font-weight: bold;
        text-shadow: 2px 2px 5px rgba(0,0,0,0.8);
        }

        .menu-items {
            display: none;

            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            width: 90%;
            max-width: 700px;
            max-height: 80vh;

            overflow-y: auto;

            background-color: white;
            padding: 25px;
            border-radius: 15px;

            box-shadow: 0 8px 25px rgba(0,0,0,0.3);

            z-index: 1000;
        }
        .menu-items.active {
            display: block;
        }
        .menu-items h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .overlay {
            display: none;

            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0,0,0,0.5);

            z-index: 999;
        }

        .overlay.active {
            display: block;
        }
        
        .items {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .item {
            display: flex;
            flex-direction: column;

            background: #fff;
            border-radius: 12px;

            overflow: hidden;

            margin-bottom: 20px;
            padding-bottom: 15px;

            border: 1px solid #eee;
        }
        
        .item:last-child {
            border-bottom: none;
        }

        .item img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .item-content {
            padding: 15px;
        }

        .item-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .item-price {
            font-weight: bold;
            color: #ff6b6b;
            margin: 0 15px;
        }

        .item-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .add-btn {
            padding: 5px 15px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .add-btn:hover {
            background-color: #0b7dda;
        }
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;

            background-color: white;
            border-top: 3px solid #ac2525;

            padding: 15px 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
            
            z-index: 100;;
        }
        .cart-total {
            background-color: #ac2525;
            color: white;
            padding: 12px 20px;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
        }
        .checkout-actions {
            display: none;
            gap: 15px;
        }

        
/* Bounce animation */
        @keyframes bounce {
            0% {
                transform: scale(1);
            }

            25% {
                transform: scale(1.25);
            }

            50% {
                transform: scale(0.95);
            }

            70% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        } 

        .cart-total.bounce {
            animation: bounce 0.4s;
        }

        .cart-total.active {
            display: block;
        }
        
        .cart-indicator {
            background-color: #ac2525;
            color: white;

            padding: 12px 18px;
            border-radius: 50px;

            font-size: 20px;
            font-weight: bold;

            display: flex;
            align-items: center;
            gap: 10px;

            margin-left: 15px;

            box-shadow: 0 2px 6px rgba(0,0,0,0.2);

            transition: transform 0.2s;
        }

        .cart-indicator.bump {
            transform: scale(1.15);
        }

        .checkout-screen {
            display: none;
            margin-top: 30px;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .checkout-screen.active {
            display: block;
        }
        
        .checkout-screen h2 {
            margin-bottom: 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .remove-btn {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .remove-btn:hover {
            background-color: #c9302c;
        }

        .checkout-total {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            text-align: right;
        }

        .checkout-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 15px;
        }

        .checkout-btn:hover {
            background-color: #45a049;
        }
        
        .checkout-actions button {
            padding: 18px 40px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            min-width: 240px;
            transition: transform 0.2s, opacity 0.2s;
        }
        
        .checkout-actions button:hover {
            transform: scale(1.05);
            opacity: 0.95;
        }

        .keep-ordering-btn {
            background-color: #2196F3;
        }
        .keep-ordering-btn:hover {
            background-color: #0b7dda;
        }
        .confirm-order-btn {
            background-color: #4CAF50;
        }
        .confirm-order-btn:hover {
            background-color: #45a049;
        }
        .payment-popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);

            justify-content: center;
            align-items: center;

            z-index: 999;
        }

        .payment-box {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            width: 350px;

            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .payment-box h2 {
            margin-bottom: 25px;
            color: #333;
        }

        .payment-btn {
            width: 100%;
            padding: 18px;
            margin: 10px 0;

            border: none;
            border-radius: 8px;

            color: white;
            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .online-btn {
            background-color: #2196F3;
        }

        .online-btn:hover {
            background-color: #0b7dda;
        }

        .counter-btn {
            background-color: #4CAF50;
        }

        .counter-btn:hover {
            background-color: #45a049;
        }

        .popup-back-btn {
            background-color: #333;
            color: white;

            border: none;
            border-radius: 6px;

            padding: 10px 18px;
            margin-bottom: 20px;

            cursor: pointer;
            font-size: 16px;

            transition: background-color 0.3s;
        }

        .popup-back-btn:hover {
            background-color: #111;
        }

    </style>
</head>

    <div class="start-screen" id="startScreen">
        <h1>Canteen Ordering System</h1>
        <button class="start-button" onclick="startOrdering()">Press to start ordering</button>
    </div>

    <div class="menu-screen" id="menuScreen">
        <button class="back-button" onclick="backToStart()">← Back</button>
    
        <div class="bottom-bar">
            <!-- Normal menu buttons -->
            <div id="menuButtons" style="display: flex; align-items: center;">
                
                <button class="checkout-btn" onclick="showCheckout()">
                    Checkout
                </button>
                
                <div class="cart-total" id="cartTotal">
                    Total: $0.00
                </div>
            
            <div class="cart-indicator">
                🛒 <span id="cartCount">0</span>
            </div>

        </div>

            <!-- Checkout page buttons -->
            <div class="checkout-actions" id="checkoutActions">

                <button class="keep-ordering-btn" onclick="keepOrdering()">
                    Keep Ordering
                </button>

                <button class="confirm-order-btn" onclick="confirmOrder()">
                    Confirm Order
                </button>

            </div> <!-- closes checkoutActions -->
        </div> <!-- closes bottom-bar -->

        <div class="categories" id="categories"></div>
        <div id="itemsContainer"></div>
        
        <div id="checkoutScreen" class="checkout-screen">    
            <h2>Checkout</h2>

            <div id="cartItems"></div>

            <div class="checkout-total" id="checkoutTotal">
                Total: $0.00
            </div>
        </div>
    
    </div> <!-- closes menuScreen -->

        let cart = [];
        let total = 0;

        function startOrdering() {
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('menuScreen').classList.add('active');
        document.getElementById('cartTotal').classList.add('active');
        displayCategories();
        }

        function backToStart() {

            const checkoutScreen =
                document.getElementById('checkoutScreen');

            if (checkoutScreen.classList.contains('active')) {

                checkoutScreen.classList.remove('active');

                document.getElementById('categories').style.display = 'grid';
                document.getElementById('itemsContainer').style.display = 'block';

                // FIXES BOTTOM BAR
                document.getElementById('menuButtons').style.display = 'flex';
                document.getElementById('checkoutActions').style.display = 'none';

            } else {

                document.getElementById('startScreen').style.display = 'flex';
                document.getElementById('menuScreen').classList.remove('active');

            }
        }

        function displayCategories() {
            const container = document.getElementById('categories');
            container.innerHTML = '';


            Object.keys(menuData).forEach(category => {
                const btn = document.createElement('button');
                btn.className = 'category-btn';
                btn.style.backgroundImage =
                    `url('${categoryImages[category]}')`;
                btn.innerHTML =
                    `<span>${
                        category.charAt(0).toUpperCase() +
                        category.slice(1)
                    }</span>`;

                btn.onclick = () => displayItems(category);
                container.appendChild(btn);
            });
        }

        function displayItems(category) {
            const container = document.getElementById('itemsContainer');
            const items = menuData[category];

            let html = `
                <div class="menu-items active">

                    <button class="popup-back-btn" onclick="closeMenu()">
                        ← Back
                    </button>

                    <h2>
                        ${category.charAt(0).toUpperCase() + category.slice(1)}
                    </h2>

                    <div class="items">
            `;

            if (items.length === 0) {
                html += '<p>No items available</p>';
            } else {
                items.forEach(item => {
                    html += `
                        <div class="item">

                            <img src="${item.image}" alt="${item.name}">

                            <div class="item-content">

                                <div class="item-name">
                                    ${item.name}
                                </div>

                                <div class="item-bottom">

                                    <div class="item-price">
                                        $${item.price.toFixed(2)}
                                    </div>

                                    <button class="add-btn"
                                        onclick="addToCart('${item.name}', ${item.price})">
                                        Add
                                    </button>

                                </div>

                            </div>

                        </div>
                    `;
                });
            }

            html += `
                    </div>
                </div>
            `;

            container.innerHTML = html;

            document.getElementById('overlay').classList.add('active');
        }

        function closeMenu() {
            document.getElementById('itemsContainer').innerHTML = '';
            document.getElementById('overlay').classList.remove('active');
        }

        function addToCart(itemName, itemPrice) {
            cart.push({
                name: itemName,
                price: itemPrice
            });
            total += itemPrice;
            updateCart();
        }
        
        function updateCart() {
            document.getElementById('cartTotal').textContent =
                `Total: $${total.toFixed(2)}`;

            document.getElementById('checkoutTotal').textContent =
                `Total: $${total.toFixed(2)}`;

            document.getElementById('cartCount').textContent = cart.length;

            const cartItemsContainer = document.getElementById('cartItems');

            let html = '';  

            if (cart.length === 0) {
                html = '<p>Your cart is empty.</p>';
            } else {
                cart.forEach((item, index) => {
                    html += `
                        <div class="cart-item">
                            <div>
                                ${item.name} - $${item.price.toFixed(2)}
                            </div>

                            <button class="remove-btn"
                                onclick="removeItem(${index})">
                                Remove
                            </button>
                        </div>
                    `;
                });
            }

            cartItemsContainer.innerHTML = html;

            // Bounce animation
            const cartTotal = document.getElementById('cartTotal');
            cartTotal.classList.remove('bounce');
            void cartTotal.offsetWidth;
            cartTotal.classList.add('bounce');
        }

        function removeItem(index) {
            total -= cart[index].price;
            cart.splice(index, 1);
            updateCart();
        }

        function showCheckout() {

            document.getElementById('categories').style.display = 'none';
            document.getElementById('itemsContainer').style.display = 'none';
            document.getElementById('checkoutScreen').classList.add('active');

            // Switch bottom bar buttons
            document.getElementById('menuButtons').style.display = 'none';
            document.getElementById('checkoutActions').style.display = 'flex';

            updateCart();
        }

        function keepOrdering() {

            document.getElementById('categories').style.display = 'grid';
            document.getElementById('itemsContainer').style.display = 'block';
            document.getElementById('checkoutScreen').classList.remove('active');

            // Switch buttons back
            document.getElementById('menuButtons').style.display = 'flex';
            document.getElementById('checkoutActions').style.display = 'none';
        }

        function confirmOrder() {
            document.getElementById('paymentPopup').style.display = 'flex';
        }

        function selectPayment(method) {
            if (method === 'online') {
                alert("Redirecting to online payment...");
            } else {
                alert("Order Confirmed! Please pay at the counter.");
            }
            document.getElementById('paymentPopup').style.display = 'none';
            
            
            cart = [];
            total = 0;
            
            
            updateCart();
            keepOrdering();
        }
    </script>
    
    <div id="paymentPopup" class="payment-popup">
        <div class="payment-box">
            <h2>Select Payment Method</h2>
            <button class="payment-btn online-btn"
                onclick="selectPayment('online')">
                Pay Online
            </button>
            <button class="payment-btn counter-btn"
                onclick="selectPayment('counter')">
                Pay at Counter
            </button>
        </div>
    </div>
    
    <div id="overlay" class="overlay" onclick="closeMenu()"></div>
